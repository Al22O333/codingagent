[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A local coding agent"
requires-python = ">=3.11"
dependencies = ["openai>=1,<3", "pathspec>=0.12,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
